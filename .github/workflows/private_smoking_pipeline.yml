name: Private Smoking Pipeline (Isolated)

on:
  schedule:
    # 06:45 IST daily = 01:15 UTC
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-smoking-sync
  cancel-in-progress: false

jobs:
  run-private-smoking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sync isolated Smoking_Log (Silver + V2.0 Stats + V2.5 ML) to Smoking_Private_Store
        # Strictly isolated credentials; zero artifact uploads; zero raw row stdout logging
        env:
          TZ: "Asia/Kolkata"
          GCP_SMOKING_SA_JSON: ${{ secrets.GCP_SMOKING_SA_JSON }}
          SHEET_ID_JOURNAL: ${{ secrets.SHEET_ID_JOURNAL }}
          SHEET_ID_SMOKING_STORE: ${{ secrets.SHEET_ID_SMOKING_STORE }}
          SHEET_ID_STORE_V2: ${{ secrets.SHEET_ID_STORE_V2 }}
        run: |
          if [ -z "$GCP_SMOKING_SA_JSON" ] || [ -z "$SHEET_ID_SMOKING_STORE" ] || [ -z "$SHEET_ID_JOURNAL" ]; then
            echo "Skipping private_smoking sync: one or more required secrets (GCP_SMOKING_SA_JSON, SHEET_ID_JOURNAL, SHEET_ID_SMOKING_STORE) are not configured yet."
            exit 0
          fi
          python -m private_smoking.run_private --source sheets
          python -m private_smoking.run_private_ml --source sheets
