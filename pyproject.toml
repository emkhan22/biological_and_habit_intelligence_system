[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-health-intelligence-engine"
version = "2.0.0"
description = "V2.0 Statistical Inference Engine + V1.5 Silver/Gold Foundations for the Personal Health Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "pyarrow>=15.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
run-health-v15 = "health_engine.run_v15:main"
run-health-v20 = "health_engine.run_v20:main"
run-private-smoking = "private_smoking.run_private:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
