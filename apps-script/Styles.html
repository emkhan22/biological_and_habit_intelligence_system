<style>
  :root {
    --bg: #141416;
    --card: #1E1E22;
    --card-2: #26262B;
    --border: #2F2F36;
    --fg: #F4F4F6;
    --muted: #9A9AA6;
    --plum: #B85A9E;
    --plum-soft: rgba(184, 90, 158, 0.16);
    --green: #22C55E;
    --blue: #38BDF8;
    --purple: #A855F7;
    --amber: #F59E0B;
    --rose: #F472B6;
    --red: #EF4444;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.45;
  }
  .app-shell { display: flex; min-height: 100vh; }

  /* Responsive Navigation: Mobile Bottom Bar -> Desktop Left Rail */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    height: 64px; background: rgba(20, 20, 22, 0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-item {
    background: none; border: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
    transition: color 0.15s ease;
  }
  .nav-item .nav-dot {
    width: 28px; height: 28px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: background 0.15s ease;
  }
  .nav-item.active { color: var(--fg); }
  .nav-item.active .nav-dot { background: var(--plum-soft); color: var(--plum); }
  .nav-brand { display: none; }

  .main-wrap {
    flex: 1; width: 100%; max-width: 860px; margin: 0 auto;
    padding: 12px 14px 86px 14px;
  }

  @media (min-width: 900px) {
    .nav-bar {
      position: fixed; top: 0; bottom: 0; left: 0; right: auto;
      width: 220px; height: 100vh;
      border-top: none; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: stretch;
      padding: 20px 12px; gap: 6px;
    }
    .nav-brand {
      display: block; padding: 6px 12px 18px 12px;
      border-bottom: 1px solid var(--border); margin-bottom: 10px;
    }
    .nav-item {
      flex-direction: row; justify-content: flex-start;
      padding: 10px 12px; border-radius: 12px; font-size: 13px; gap: 10px;
    }
    .nav-item.active { background: var(--plum-soft); color: var(--fg); }
    .main-wrap { margin-left: 220px; max-width: 980px; padding: 20px 28px 40px 28px; }
  }

  /* Header */
  .top-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding-bottom: 12px; margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .top-title { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .top-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--fg);
    border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .icon-btn.private-on { border-color: var(--rose); color: var(--rose); background: rgba(244,114,182,0.12); }

  /* Cards & Grids */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
  }
  .card-plum {
    background: linear-gradient(180deg, rgba(184,90,158,0.22), rgba(30,30,34,0.95));
    border-color: rgba(184,90,158,0.45);
  }
  .card-title { font-size: 14px; font-weight: 700; margin: 0 0 4px 0; }
  .card-sub { font-size: 12px; color: var(--muted); margin: 0; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 560px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }

  .stat-tile {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px;
  }
  .stat-k { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .stat-v { font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat-d { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* Provenance Badges (7-state contract) */
  .prov {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card-2); color: var(--muted);
    white-space: nowrap;
  }
  .prov-measured { color: var(--green); border-color: rgba(34,197,94,0.35); }
  .prov-derived  { color: var(--blue); border-color: rgba(56,189,248,0.35); }
  .prov-model    { color: var(--amber); border-color: rgba(245,158,11,0.4); }
  .prov-window   { color: var(--purple); border-color: rgba(168,85,247,0.4); }
  .prov-ai       { color: var(--plum); border-color: rgba(184,90,158,0.5); }

  /* Swipeable Coaching Cards */
  .h-scroll {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
    scroll-snap-type: x mandatory;
  }
  .coach-card {
    flex: 0 0 265px; scroll-snap-align: start;
    background: var(--card-2); border: 1px solid rgba(184,90,158,0.35);
    border-radius: 14px; padding: 12px;
  }
  .coach-drawer {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--muted); display: none;
  }
  .coach-drawer.open { display: block; }
  .link-btn {
    background: none; border: none; color: var(--plum); padding: 0;
    font-size: 11.5px; font-weight: 600; cursor: pointer; margin-top: 6px;
  }

  /* Category Chips & Glapp Progress Rows */
  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
  .chip {
    flex: 0 0 auto; background: var(--card); border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .chip.active { background: var(--plum); border-color: var(--plum); color: #fff; }
  .chip.v2 { opacity: 0.55; border-style: dashed; cursor: default; }

  .metric-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 9px;
    cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .metric-row:hover { border-color: var(--plum); }
  .metric-left { min-width: 0; flex: 1; }
  .metric-cat { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .metric-val { font-size: 17px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .metric-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .metric-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .chev { color: var(--muted); font-size: 15px; }

  /* Full-Screen Drill-Down Detail View */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 60; background: var(--bg);
    overflow-y: auto; padding: 14px 14px 40px 14px; display: none;
  }
  .detail-overlay.open { display: block; }
  .detail-inner { max-width: 820px; margin: 0 auto; }
  .seg-bar {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 3px; margin: 12px 0;
  }
  .seg-btn {
    background: none; border: none; color: var(--muted); padding: 6px 0;
    border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .seg-btn.active { background: var(--card-2); color: var(--fg); }

  .overlay-tray { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .ov-pill {
    background: var(--card-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .ov-pill.on { border-color: var(--plum); color: var(--fg); background: var(--plum-soft); }

  /* Dual-PIN Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.72);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    width: 100%; max-width: 360px; background: var(--card);
    border: 1px solid var(--border); border-radius: 18px; padding: 18px;
  }
  .pin-input {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--border); color: var(--fg);
    font-size: 16px; letter-spacing: 4px; text-align: center; margin: 10px 0;
  }
  .btn-primary {
    background: var(--plum); color: #fff; border: none; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-ghost {
    background: var(--card-2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }

  /* Tables & Bars */
  table.clean-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.clean-tbl th, table.clean-tbl td {
    text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border);
  }
  table.clean-tbl th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .bar-track { width: 100%; height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; border-radius: 999px; }
  .slider-row { margin: 10px 0; }
  .slider-row input[type="range"] { width: 100%; accent-color: var(--plum); }
  .hidden { display: none !important; }
  .loading-box { text-align: center; padding: 60px 20px; color: var(--muted); }
  .alert-row { padding: 9px 11px; border-radius: 10px; background: var(--card-2); border-left: 3px solid var(--amber); margin-top: 8px; font-size: 12px; }
  .alert-row.info { border-left-color: var(--blue); }
  .pill-matrix { display: grid; grid-template-columns: 92px repeat(7, 1fr); gap: 5px; align-items: center; font-size: 11px; }
  .pm-cell { height: 12px; border-radius: 999px; background: var(--card-2); }
  .pm-cell.on { background: var(--plum); }

  /* Print Stylesheet for 1-Page Whole-Body Doctor Visit Brief */
  @media print {
    body { background: #fff !important; color: #111 !important; font-size: 11pt; }
    .nav-bar, .top-header, .no-print, .detail-overlay, .modal-backdrop { display: none !important; }
    .main-wrap { margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
    .card { background: #fff !important; border: 1px solid #ccc !important; color: #111 !important; break-inside: avoid; }
    .card-sub, .stat-k, table.clean-tbl th { color: #444 !important; }
    table.clean-tbl td, table.clean-tbl th { border-color: #ddd !important; }
  }
</style>
