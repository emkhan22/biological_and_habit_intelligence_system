<script>
/**
 * App.html — V2.2 Lock-Screen-First Glapp+ Client Controller.
 * Zero health data fetched or rendered until server verifies PIN 1 or PIN 2.
 */
(function () {
  const STATE = {
    unlocked: false,
    data: null,
    doctorBrief: null,
    tab: 'home',
    category: 'all',
    selectedWeekIdx: -1,
    privacyMode: 'clean',
    privateToken: '',
    smokingData: null,
    detailMetric: null,
    detailRange: 'All',
    nutrSubTab: 'fiber',
    symptomFilter: 'All',
    symptomCompare: 'sleep_hrs',
    labTab: 'HbA1c',
    labYearCutoff: '2022',
    medFilter: 'All',
    overlays: { jabs: true, meds: false, period: true, workouts: false, poorSleep: false }
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cleanDateStr_(s) {
    return String(s || '').replace(/\s+(00:00:00|05:30:00).*$/i, '').replace(/T.*$/, '').trim();
  }
  function fmtDateIN_(iso) {
    if (window.Charts && window.Charts.fmtDateIN) return window.Charts.fmtDateIN(iso);
    const c = cleanDateStr_(iso);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(c)) return c || '—';
    const p = c.split('-');
    return p[2] + '-' + p[1] + '-' + p[0];
  }
  function fmtHrsMin_(hrs) {
    if (window.Charts && window.Charts.fmtHrsMin) return window.Charts.fmtHrsMin(hrs);
    if (hrs === '' || hrs == null || isNaN(Number(hrs))) return '—';
    const m = Math.round(Number(hrs) * 60);
    return Math.floor(m / 60) + 'h ' + (m % 60 < 10 ? '0' : '') + (m % 60) + 'm';
  }
  function fmt(v, unit) {
    return (v === '' || v == null) ? '—' : (String(v) + (unit ? ' ' + unit : ''));
  }
  function provBadge(type) {
    const map = {
      Measured: ['prov-measured', '● Measured'],
      Derived: ['prov-derived', '◆ Derived'],
      Model: ['prov-model', '◇ Model Estimate'],
      Window: ['prov-window', '◐ Expected Window'],
      AI: ['prov-ai', '✦ AI Interpretation'],
      Unavailable: ['', '○ Unavailable']
    };
    const m = map[type] || map.Measured;
    return '<span class="prov ' + m[0] + '">' + m[1] + '</span>';
  }
  function safeChart_(fnName, args, fallbackHtml) {
    try {
      const lib = window.Charts;
      if (lib && typeof lib[fnName] === 'function') return lib[fnName].apply(lib, args || []);
    } catch (e) {
      if (window.console && console.error) console.error('Chart error (' + fnName + '):', e);
    }
    return fallbackHtml || '';
  }

  // ==================== LOCK-SCREEN-FIRST PRIVACY GATE ====================
  const pinGate = document.getElementById('pinGate');
  const appShell = document.getElementById('appShell');
  const pinField = document.getElementById('pin-field');
  const pinStatus = document.getElementById('pin-status');
  const btnPinSubmit = document.getElementById('btn-pin-submit');

  function lockAndWipe_() {
    const prevTok = STATE.privateToken;
    STATE.unlocked = false;
    STATE.data = null;
    STATE.doctorBrief = null;
    STATE.privacyMode = 'clean';
    STATE.privateToken = '';
    STATE.smokingData = null;
    STATE.detailMetric = null;
    STATE.category = 'all';
    document.getElementById('detail-overlay').classList.remove('open');
    ['home', 'progress', 'reports', 'wisdom'].forEach(function (t) {
      const el = document.getElementById('view-' + t);
      el.innerHTML = '';
      el.classList.add('hidden');
    });
    appShell.classList.add('hidden');
    pinField.value = '';
    pinStatus.textContent = '';
    btnPinSubmit.disabled = false;
    pinGate.classList.remove('hidden');
    pinField.focus();
    if (prevTok) {
      google.script.run.withFailureHandler(function () {}).revokePrivateSession(prevTok);
    }
  }

  function fetchPostPinData_(mode, token) {
    pinGate.classList.add('hidden');
    appShell.classList.remove('hidden');
    document.getElementById('loading-view').classList.remove('hidden');
    STATE.unlocked = true;
    STATE.privacyMode = mode;
    STATE.privateToken = token || '';

    google.script.run
      .withSuccessHandler(function (payload) {
        STATE.data = payload;
        STATE.selectedWeekIdx = Math.max(0, (payload.weekly || []).length - 1);
        document.getElementById('header-sub').textContent = 'Synced ' + payload.meta.loadedAt + ' · ' + payload.meta.calcVersion;
        if (mode === 'private' && token) {
          google.script.run
            .withSuccessHandler(function (smData) {
              STATE.smokingData = smData;
              document.getElementById('loading-view').classList.add('hidden');
              safeRenderCurrentTab_();
            })
            .withFailureHandler(function () {
              document.getElementById('loading-view').classList.add('hidden');
              safeRenderCurrentTab_();
            })
            .getPrivateSmokingAnalytics(token);
        } else {
          document.getElementById('loading-view').classList.add('hidden');
          safeRenderCurrentTab_();
        }
      })
      .withFailureHandler(function (err) {
        document.getElementById('loading-view').innerHTML =
          '<div style="color:var(--red);font-weight:700;">Failed to load data</div>' +
          '<div style="font-size:12px;margin-top:6px;">' + esc((err && err.message) || err) + '</div>';
      })
      .getDashboardPayload();
  }

  pinField.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); btnPinSubmit.click(); }
  });
  btnPinSubmit.addEventListener('click', function () {
    const val = pinField.value.trim();
    if (!val) { pinStatus.textContent = 'Please enter your PIN.'; return; }
    btnPinSubmit.disabled = true;
    pinStatus.textContent = 'Checking…';

    let settled = false;
    const timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      btnPinSubmit.disabled = false;
      pinStatus.textContent = 'Request timed out. Please try again.';
    }, 15000);

    google.script.run
      .withSuccessHandler(function (res) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (!res || res.error) {
          btnPinSubmit.disabled = false;
          pinStatus.textContent = (res && res.error) ? res.error : 'Invalid PIN.';
          return;
        }
        pinField.value = '';
        pinStatus.textContent = '';
        btnPinSubmit.disabled = false;
        fetchPostPinData_(res.mode === 'private' ? 'private' : 'clean', res.token || '');
      })
      .withFailureHandler(function (e) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        btnPinSubmit.disabled = false;
        pinStatus.textContent = String((e && e.message) || e || 'Verification failed.');
      })
      .verifyPinMode(val);
  });

  document.getElementById('btn-lock').addEventListener('click', lockAndWipe_);
  document.getElementById('btn-refresh').addEventListener('click', function () {
    if (STATE.unlocked) fetchPostPinData_(STATE.privacyMode, STATE.privateToken);
  });

  // ==================== NAVIGATION ====================
  document.querySelectorAll('.nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      STATE.tab = btn.dataset.tab;
      document.querySelectorAll('.nav-item').forEach(function (b) {
        b.classList.toggle('active', b === btn);
        b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
      });
      const titles = { home: 'Health Control Centre', progress: 'Progress & Analytics', reports: 'Reports & Doctor Brief', wisdom: 'Wisdom & Research' };
      document.getElementById('header-title').textContent = titles[STATE.tab] || 'Health Intelligence';
      safeRenderCurrentTab_();
    });
  });

  function safeRenderCurrentTab_() {
    if (!STATE.unlocked || !STATE.data) return;
    try {
      ['home', 'progress', 'reports', 'wisdom'].forEach(function (t) {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== STATE.tab);
      });
      if (STATE.tab === 'home') renderHome();
      if (STATE.tab === 'progress') renderProgress();
      if (STATE.tab === 'reports') renderReports();
      if (STATE.tab === 'wisdom') renderWisdom();
    } catch (e) {
      if (window.console && console.error) console.error('Render error:', e);
    }
  }

  // ==================== TAB 1: HOME ====================
  function renderHome() {
    const d = STATE.data;
    const daily = d.daily || [];
    const latest = daily[daily.length - 1] || {};
    const cur7 = d.habitSummary.cur7 || {};
    const prev7 = d.habitSummary.prev7 || {};
    const latestW = getLatestWeight_(daily);
    const oct7 = Number(d.meta.oct7BaselineKg || 108.3);
    const pctLost = latestW ? (((oct7 - latestW.w) / oct7) * 100) : null;
    const distLiver7 = pctLost != null ? Math.max(0, 7.0 - pctLost).toFixed(2) : '—';
    const distClass1 = pctLost != null ? Math.max(0, 14.0 - pctLost).toFixed(1) : '—';
    const distOverwt = pctLost != null ? Math.max(0, 26.5 - pctLost).toFixed(1) : '—';

    const pillars = [
      { name: 'Sleep', score: cur7.avgSleep ? Math.min(100, Math.round((cur7.avgSleep / 7.5) * 100)) : null, color: '#A855F7', formula: '7d avg sleep (' + fmtHrsMin_(cur7.avgSleep) + ') ÷ 7h 30m target (unworn <2h nights excluded).' },
      { name: 'Activity', score: cur7.avgSteps ? Math.min(100, Math.round((cur7.avgSteps / 7000) * 100)) : null, color: '#22C55E', formula: '7d avg steps (' + fmt(cur7.avgSteps) + ') ÷ 7,000 daily step target.' },
      { name: 'Nutrition', score: cur7.avgProtein ? Math.min(100, Math.round((cur7.avgProtein / 100) * 100)) : null, color: '#F59E0B', formula: '7d avg protein (' + fmt(cur7.avgProtein, 'g') + ') ÷ 100g muscle-sparing target (unlogged days excluded).' },
      { name: 'Meds', score: latest.meds_taken !== '' ? Math.round((Number(latest.meds_taken) / Math.max(1, Number(latest.meds_taken) + Number(latest.meds_skipped || 0))) * 100) : null, color: '#38BDF8', formula: 'Latest logged meds taken ÷ (taken + skipped) from Micro Journal Meds_Log.' },
      { name: 'Symptoms', score: latest.side_effect_count === '' ? 90 : Math.max(25, 100 - Number(latest.side_effect_count) * 15), color: '#B85A9E', formula: '100 − (15 × latest daily logged symptom count), floored at 25.' }
    ];
    if (STATE.privacyMode === 'private' && STATE.smokingData) {
      const smk = STATE.smokingData;
      pillars.push({
        name: 'Smoke-Free',
        score: smk.totalCigarettesSmoked === 0 ? 100 : Math.max(20, 100 - smk.totalCigarettesSmoked * 15),
        color: '#F472B6',
        formula: '100 − (15 × logged cigarettes), boosted by resisted cravings.'
      });
    }
    const validPillars = pillars.filter(function (p) { return p.score != null; });
    const ringScore = validPillars.length ? Math.round(validPillars.reduce(function (s, p) { return s + p.score; }, 0) / validPillars.length) : null;

    const wbDelta = (cur7.avgWellbeing !== '' && prev7.avgWellbeing !== '') ? Math.round(cur7.avgWellbeing - prev7.avgWellbeing) : null;
    let html = '<div class="grid-2">';
    html += tileFormulaHtml_('Weekly Habit Momentum', fmt(cur7.avgWellbeing, '/100'), wbDelta == null ? 'Rolling 7-day average' : ((wbDelta >= 0 ? '↑ +' : '↓ ') + wbDelta + ' vs prior 7d'), '#B85A9E', 'fm-wb', 'Equal-weighted mean of available daily pillars (Sleep ÷ 7.5h, Steps ÷ 7,000, Protein ÷ 100g, HRV ÷ 45ms, Meds adherence). Missing pillars are excluded, never scored 0.');
    html += tileFormulaHtml_('Muscle Shield', fmt(cur7.avgProtein, 'g/d'), '7d avg protein · ' + (cur7.strengthSessions || 0) + ' strength in 7d', '#F59E0B', 'fm-ms', 'Tracks 7-day average daily protein intake (target ≥100g/d) paired with 7-day strength/resistance session count (target ≥2/wk).');
    html += tileFormulaHtml_('Recovery & Readiness', fmtHrsMin_(cur7.avgSleep), 'HRV ' + fmt(cur7.avgHrv, 'ms') + ' · RHR ' + fmt(cur7.avgRhr, 'bpm'), '#A855F7', 'fm-rec', '7-day valid nightly sleep duration (excluding <2h unworn nights), paired with Fitbit HRV RMSSD and resting HR.');
    html += tileFormulaHtml_('Metabolic Pulse', pctLost != null ? ('−' + pctLost.toFixed(2) + '%') : '—', distLiver7 + '% to 7% Fatty Liver · ' + distClass1 + '% to Class I · ' + distOverwt + '% to Overweight', '#22C55E', 'fm-met', 'Percentage body-weight reduction since 07-10-2026 baseline. Milestones track % distance to 7% MASLD steatosis reversal zone, Obesity Class I (BMI <35), and Overweight (BMI <30).');
    html += '</div>';

    // Weekly Body Readiness Ring with per-pillar formula info
    html += '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
        '<div><h2 class="card-title">Weekly Body Readiness</h2><p class="card-sub">Tap ⓘ on any pillar to see exact formula &amp; inputs</p></div>' +
        provBadge('Derived') + '</div>' +
      safeChart_('renderReadinessRing', [pillars, ringScore, 'This Week'], '') +
      '<div class="grid-3" style="margin-top:10px;">' + pillars.map(function (p, i) {
        return '<div style="background:var(--card-2);padding:7px 9px;border-radius:10px;font-size:11px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<span style="color:' + p.color + ';font-weight:700;">● ' + esc(p.name) + '</span>' +
            '<button class="info-btn" data-fbox="pil-' + i + '" title="Formula">ⓘ</button>' +
          '</div>' +
          '<div style="font-weight:700;font-size:14px;margin-top:2px;">' + (p.score == null ? '—' : p.score + '/100') + '</div>' +
          '<div class="formula-box" id="pil-' + i + '">' + esc(p.formula) + '</div></div>';
      }).join('') + '</div></div>';

    // Daily Coaching & Logging Nudges
    const nudges = buildDailyNudges_(cur7);
    html += '<div class="card card-plum">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
        '<div><h2 class="card-title">Daily Coaching &amp; Logging Nudges</h2><p class="card-sub">Tap any card for Why + Your Data + Evidence</p></div>' +
        provBadge('Derived') + '</div>' +
      '<div class="h-scroll">' + nudges.map(function (n, idx) {
        return '<div class="coach-card">' +
          '<div style="font-size:10.5px;font-weight:700;color:var(--plum);text-transform:uppercase;">' + esc(n.tag) + '</div>' +
          '<div style="font-weight:700;font-size:13.5px;margin-top:3px;">' + esc(n.title) + '</div>' +
          '<div style="font-size:12px;color:var(--fg);margin-top:4px;">' + esc(n.action) + '</div>' +
          '<button class="link-btn" data-drawer="nd-' + idx + '">Why + Your Data ▾</button>' +
          '<div class="coach-drawer" id="nd-' + idx + '"><strong>Your Data:</strong> ' + esc(n.dataWhy) + '<br/><strong>Evidence:</strong> ' + esc(n.evidence) + '</div></div>';
      }).join('') + '</div></div>';

    // Inside Your Body (Gemini)
    const insideAi = (d.aiOutputs || []).slice().reverse().find(function (r) { return r.report_type === 'INSIDE_YOUR_BODY'; });
    const aiIsFresh = insideAi && cleanDateStr_(insideAi.period_key) === cleanDateStr_(latest.date);
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;">' +
      '<div><h2 class="card-title">Inside Your Body</h2><p class="card-sub">Multi-therapy physiological synthesis</p></div>' +
      (aiIsFresh ? provBadge('AI') : '<span class="prov prov-model">◐ Pending Today\'s Brief</span>') + '</div>';
    if (insideAi) {
      html += '<div style="font-weight:700;font-size:13.5px;margin-bottom:5px;">' + esc(insideAi.headline) + '</div>' +
        '<p style="font-size:12.5px;color:var(--muted);margin:0 0 8px 0;">' + esc(insideAi.body_markdown) + '</p>' +
        '<div style="font-size:11px;color:var(--muted);">Updated: ' + esc(insideAi.generated_at) + ' · ' + esc(insideAi.citations || '') + '</div>';
    } else {
      html += '<p class="card-sub">Phase 3 Gemini Scheduled Action will populate your daily biological narrative here.</p>';
    }
    html += '</div>';

    // Clinical & QA Alerts
    const qaWarnings = (d.qaLog || []).filter(function (q) { return String(q.qa_flag || '').toLowerCase() !== 'info'; });
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><h2 class="card-title">Clinical &amp; Data-Quality Alerts</h2><span style="font-size:11px;color:var(--muted);">Separate from Wellbeing Score</span></div>' +
      '<div class="alert-row info"><strong>Post-IV-Iron Lab Window Open:</strong> ~7 wks post 10-10-2026 Orofer FCM 1000 mg infusion — discuss repeat CBC &amp; Ferritin with your doctor.</div>';
    if (cur7.avgFiber !== '' && cur7.avgFiber < 20) {
      html += '<div class="alert-row"><strong>Fiber Gap (7d avg ' + cur7.avgFiber + ' g/d):</strong> Below 25g target; monitor constipation &amp; glycemic response.</div>';
    }
    qaWarnings.slice(0, 3).forEach(function (q) {
      html += '<div class="alert-row"><strong>' + esc(q.domain) + ' (' + esc(q.qa_flag) + '):</strong> ' + esc(q.coverage_or_status) + '</div>';
    });
    html += '</div>';

    if (latest.active_period === 'Yes') {
      html += '<div class="card" style="border-color:rgba(244,114,182,0.5);"><div style="display:flex;justify-content:space-between;align-items:center;"><h2 class="card-title" style="color:var(--rose);">Active Period Logged</h2>' + provBadge('Measured') + '</div><p class="card-sub" style="margin-top:4px;">Weight fluctuations, bloating, and headaches may reflect cycle phase.</p></div>';
    }

    const el = document.getElementById('view-home');
    el.innerHTML = html;
    el.querySelectorAll('[data-drawer]').forEach(function (btn) {
      btn.addEventListener('click', function () { document.getElementById(btn.dataset.drawer).classList.toggle('open'); });
    });
    el.querySelectorAll('[data-fbox]').forEach(function (btn) {
      btn.addEventListener('click', function () { document.getElementById(btn.dataset.fbox).classList.toggle('open'); });
    });
  }

  // ==================== TAB 2: PROGRESS ====================
  function getMetricCatalog_() {
    const d = STATE.data, daily = d.daily || [], cur7 = d.habitSummary.cur7 || {}, bm = d.habitSummary.benchmarks || {};
    const latestBC = daily.slice().reverse().find(function (r) { return r.fat_mass_kg !== ''; }) || {};

    const items = [
      { id: 'fat_lean', cat: 'bodycomp', catLabel: 'Body Comp', color: '#22C55E', title: 'Fat vs. Lean Mass (Fitdays BIA)',
        val: latestBC.fat_mass_kg ? (latestBC.fat_mass_kg + ' kg fat · ' + latestBC.muscle_mass_kg + ' kg muscle') : '—',
        sub: 'Skeletal muscle ' + fmt(latestBC.skeletal_muscle_pct, '%') + ' · Visceral ' + fmt(latestBC.visceral_fat),
        prov: 'Measured', mini: 'spark', field: 'fat_mass_kg', field2: 'muscle_mass_kg', color2: '#38BDF8', label1: 'Fat Mass', label2: 'Muscle Mass', unit1: 'kg', unit2: 'kg', kind: 'line', domainCov: 'bodyComp', allowedOverlays: ['jabs', 'period'],
        legend: [{ color: '#22C55E', label: 'Fat Mass (kg)' }, { color: '#38BDF8', label: 'Muscle Mass (kg)' }],
        about: 'Fitdays BIA estimates are hydration- and cycle-sensitive. Only Jab days & Period overlays apply to weekly weigh-in cadence.' },
      { id: 'bone_prot', cat: 'bodycomp', catLabel: 'Body Comp', color: '#22C55E', title: 'Bone Health & Protein Weight',
        val: fmt(latestBC.bone_mass_kg, 'kg bone') + ' · ' + fmt(latestBC.protein_mass_kg, 'kg prot'),
        sub: 'Structural mass tracking during weight loss',
        prov: 'Measured', mini: 'spark', field: 'protein_mass_kg', label1: 'Protein Mass', unit1: 'kg', kind: 'line', domainCov: 'bodyComp', allowedOverlays: ['jabs', 'period'],
        about: 'Monitors Fitdays-estimated bone mass and body protein mass alongside protein intake and strength training.' },
      { id: 'goal_sim', cat: 'bodycomp', catLabel: 'Body Comp', color: '#22C55E', title: 'Goal Path Simulator & Loss Rate',
        val: 'SVG Trajectory + TDEE Model', sub: 'Projected curve, ±20% band & metabolic adaptation insights',
        prov: 'Model', mini: 'spark', field: 'weight_kg', kind: 'goal_sim', noRangeBar: true, domainCov: 'weight',
        about: 'Model Estimate: projects continuation curve and ±20% deceleration band, plus estimates when ~1,400 kcal/d approaches maintenance TDEE.' },

      { id: 'bio_audit', cat: 'bioavail', catLabel: 'Bioavailability', color: '#38BDF8', title: 'Absorption, Timing & Skipped-Dose Audit',
        val: (d.bioAudit || []).length + ' med logs audited', sub: 'Med selector · exact timestamps · fasting gap · stabilization curves',
        prov: 'Derived', mini: 'dots', field: 'meds_taken', kind: 'bio_table', noRangeBar: true, domainCov: 'meds',
        about: 'Uses exact Micro Journal Meds_Log HH:mm timestamps cross-referenced with Nutrition_Log first meal time. Skipped doses are strictly tagged Skipped.' },

      { id: 'protein', cat: 'nutrition', catLabel: 'Nutrition', color: '#F59E0B', title: 'Protein & Muscle Preservation',
        val: fmt(cur7.avgProtein, 'g/d (7d)'), sub: 'Target ~100g/d · ' + (cur7.nutritionLoggedDays || 0) + '/7 days logged',
        prov: 'Derived', mini: 'bars', field: 'protein_g', label1: 'Protein', unit1: 'g', kind: 'bar', domainCov: 'nutrition',
        about: 'Unlogged days are excluded (never 0g). Pair high protein with ≥2×/wk strength training to protect lean mass.' },
      { id: 'calories', cat: 'nutrition', catLabel: 'Nutrition', color: '#F59E0B', title: 'Calories & Anti-Crash Floor',
        val: fmt(cur7.avgCalories, 'kcal/d'), sub: 'Overlaid with smooth Tirzepatide PK curve',
        prov: 'Derived', mini: 'bars', field: 'calories_kcal', label1: 'Calories', unit1: 'kcal', kind: 'bar', showPk: true, domainCov: 'nutrition',
        legend: [{ color: '#F59E0B', label: 'Daily Calories (kcal)' }, { color: '#22C55E', label: 'Est. Tirzepatide PK Curve' }, { color: '#38BDF8', label: 'Strength / Med Changes' }],
        about: 'Compares daily calories against the smooth hourly Tirzepatide PK curve to spot under-eating on peak suppression days.' },
      { id: 'fiber_water', cat: 'nutrition', catLabel: 'Nutrition', color: '#F59E0B', title: 'Fiber, Sugar & Hydration',
        val: fmt(cur7.avgFiber, 'g fiber') + ' · ' + fmt(cur7.avgSugar, 'g sugar') + ' · ' + fmt(cur7.avgWater, 'L'),
        sub: 'Multi-metric sub-tabs for Fiber, Added Sugar & Hydration',
        prov: 'Derived', mini: 'bars', field: 'fiber_g', kind: 'nutr_subtabs', domainCov: 'nutrition',
        about: 'Switch between Fiber (target 25g), Sugar (target <25g), and Hydration (target 2.5L). Unlogged days are never treated as 0.' },

      { id: 'fatty_liver', cat: 'metabolic', catLabel: 'Metabolic & Labs', color: '#22C55E', title: 'Grade 1 Fatty Liver Reversal Simulator',
        val: 'Phase 1 (≥5%) Crossed!', sub: 'Multi-driver clinical simulator + rationale',
        prov: 'Model', mini: 'spark', field: 'weight_kg', kind: 'liver_sim', noRangeBar: true, domainCov: 'weight',
        about: 'Model Estimate grounded in AASLD/EASL MASLD guidelines & tirzepatide hepatic trials. Verify with follow-up ultrasound & LFTs.' },
      { id: 'glucose_labs', cat: 'metabolic', catLabel: 'Metabolic & Labs', color: '#22C55E', title: 'Blood Glucose, HbA1c & Lab Trends',
        val: (d.labs || []).length + ' longitudinal lab rows', sub: '8 individual biomarker tabs · 2020–2026 SVG trends',
        prov: 'Measured', mini: 'spark', field: 'weight_kg', kind: 'labs_view', noRangeBar: true, domainCov: 'weight',
        about: 'Individual biomarker tabs with Since 2022 / All Years filter, reference-range shading, and What-If projection bands.' },

      { id: 'symptoms_pk', cat: 'symptoms', catLabel: 'Symptoms', color: '#38BDF8', title: 'Symptoms × Lifestyle & Tirzepatide Level',
        val: (d.symptomsEvents || []).length + ' granular logs', sub: 'Symptom filter · hourly Bateman PK · Sleep/Steps/Hydration/Food overlay',

  function renderProgress() {
    const chips = [
      { id: 'all', lbl: 'All' }, { id: 'bodycomp', lbl: 'Body Comp' }, { id: 'bioavail', lbl: 'Bioavailability' },
      { id: 'nutrition', lbl: 'Nutrition' }, { id: 'metabolic', lbl: 'Metabolic & Labs' },
      { id: 'symptoms', lbl: 'Symptoms' }, { id: 'sleep', lbl: 'Sleep' },
      { id: 'activity', lbl: 'Activity' }, { id: 'mood', lbl: 'Mood & Habits' }, { id: 'cycle', lbl: 'Cycle' }
    ];
    if (STATE.privacyMode === 'private') chips.push({ id: 'cravings', lbl: 'Cravings' });

    const catalog = getMetricCatalog_();
    const filtered = STATE.category === 'all' ? catalog : catalog.filter(function (m) { return m.cat === STATE.category; });
    const daily = STATE.data.daily || [];

    let html = '<div class="chips">' + chips.map(function (c) {
      return '<button class="chip ' + (STATE.category === c.id ? 'active' : '') + '" data-cat="' + c.id + '">' + esc(c.lbl) + '</button>';
    }).join('') + '<span class="chip v2">V2: Skincare</span></div>';

    html += filtered.map(function (m) {
      const vals = daily.map(function (r) { return r[m.field]; });
      const miniFn = m.mini === 'bars' ? 'renderMiniBars' : (m.mini === 'dots' ? 'renderMiniDots' : 'renderMiniSpark');
      return '<div class="metric-row" data-mid="' + m.id + '">' +
        '<div class="metric-left">' +
          '<div class="metric-cat" style="color:' + m.color + ';"><span>● ' + esc(m.catLabel) + '</span> ' + provBadge(m.prov) + '</div>' +
          '<div class="metric-val">' + esc(m.title) + '</div>' +
          '<div class="metric-sub">' + esc(m.val) + ' · ' + esc(m.sub) + '</div>' +
        '</div>' +
        '<div class="metric-right">' + safeChart_(miniFn, [vals, m.color], '') + '<span class="chev">›</span></div></div>';
    }).join('');

    const el = document.getElementById('view-progress');
    el.innerHTML = html;
    el.querySelectorAll('[data-cat]').forEach(function (b) {
      b.addEventListener('click', function () { STATE.category = b.dataset.cat; renderProgress(); });
    });
    el.querySelectorAll('[data-mid]').forEach(function (row) {
      row.addEventListener('click', function () {
        const m = catalog.find(function (x) { return x.id === row.dataset.mid; });
        if (m) openDetailScreen(m);
      });
    });
  }

    const map = { W: 7, M: 30, '3M': 90, '6M': 180, Y: 365, All: 9999 };
    return rows.slice(Math.max(0, rows.length - (map[range] || 9999)));

    } else if (m.kind === 'smoking_view' && STATE.smokingData) {
      const sm = STATE.smokingData;
      body = '<div class="card"><div class="grid-3">' +
        tileHtml_('Smoked', sm.totalCigarettesSmoked, 'Logged events', '#F472B6') +
        tileHtml_('Cravings Resisted', sm.cravingsResisted, 'Every urge beaten counts!', '#22C55E') +
        tileHtml_('Avg Delay', fmt(sm.avgDelayMinutes, 'min'), 'Intensity ' + fmt(sm.avgCravingIntensity), '#38BDF8') +
        '</div><div class="alert-row info" style="margin-top:10px;"><strong>Sleep Co-Occurrence (' + esc(sm.coOccurrenceNote.label) + '):</strong> ' +
        esc(sm.coOccurrenceNote.note || ('Avg sleep on smoked days: ' + fmtHrsMin_(sm.coOccurrenceNote.avgSleepHrsOnSmokedDays) + ' (n=' + sm.coOccurrenceNote.n + ')')) + '</div></div>';
    } else {
      body = '<div class="card">' + safeChart_('renderDetailChart', [{
        rows: rows, field: m.field, field2: m.field2, label1: m.label1, label2: m.label2, unit1: m.unit1, unit2: m.unit2,
        color: m.color, color2: m.color2, kind: m.kind, minY: m.minY, maxY: m.maxY,
        showPk: m.showPk, shots: shots, dayGrid: m.dayGrid, showHrSpikes: m.showHrSpikes,
        legend: m.legend, overlays: STATE.overlays
      }], '') + overlayTrayHtml_(m.allowedOverlays) + '</div>';

      if (m.id === 'mood_impact') {
        const hi = (d.daily || []).filter(function (r) { return r.glapp_mood !== '' && Number(r.glapp_mood) >= 3; });
        const lo = (d.daily || []).filter(function (r) { return r.glapp_mood !== '' && Number(r.glapp_mood) <= 2; });
        const avgF = function (arr, f) {
          const vs = arr.map(function (r) { return r[f] === '' || r[f] == null ? null : Number(r[f]); }).filter(function (v) { return v !== null; });
          return vs.length ? (vs.reduce(function (a, b) { return a + b; }, 0) / vs.length).toFixed(1) : '—';
        };
        body += '<div class="card"><h3 class="card-title">Good Mood Days vs. Low Mood Days ' + provBadge('Derived') + '</h3>' +
          '<table class="clean-tbl"><thead><tr><th>Metric</th><th>Good Mood (≥3, n=' + hi.length + ')</th><th>Low Mood (≤2, n=' + lo.length + ')</th></tr></thead><tbody>' +
          '<tr><td>Sleep</td><td><strong>' + fmtHrsMin_(avgF(hi, 'sleep_hrs')) + '</strong></td><td>' + fmtHrsMin_(avgF(lo, 'sleep_hrs')) + '</td></tr>' +
          '<tr><td>Steps</td><td><strong>' + avgF(hi, 'steps') + '</strong></td><td>' + avgF(lo, 'steps') + '</td></tr>' +
          '<tr><td>Protein (g)</td><td><strong>' + avgF(hi, 'protein_g') + '</strong></td><td>' + avgF(lo, 'protein_g') + '</td></tr>' +
          '<tr><td>Fiber (g)</td><td><strong>' + avgF(hi, 'fiber_g') + '</strong></td><td>' + avgF(lo, 'fiber_g') + '</td></tr>' +
          '<tr><td>Hydration (L)</td><td><strong>' + avgF(hi, 'water_l') + '</strong></td><td>' + avgF(lo, 'water_l') + '</td></tr>' +
          '</tbody></table></div>' +
          '<div class="card"><h3 class="card-title">49-Day Cross-Domain Logging Heatmap</h3>' + safeChart_('renderHeatmap', [d.daily || []], '') + '</div>';
      }
    }

    const segBar = m.noRangeBar ? '' : ('<div class="seg-bar">' + ['W', 'M', '3M', '6M', 'Y', 'All'].map(function (r) {
      return '<button class="seg-btn ' + (STATE.detailRange === r ? 'active' : '') + '" data-rng="' + r + '">' + r + '</button>';
    }).join('') + '</div>');

    const box = document.getElementById('detail-content');
    box.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><button class="btn-ghost" id="btn-detail-back">← Back</button>' + provBadge(m.prov) + '</div>' +
      '<h2 style="margin:12px 0 2px 0;font-size:19px;">' + esc(m.title) + '</h2>' +
      '<div style="font-size:12px;color:var(--muted);">' + esc(m.val) + ' · ' + esc(m.sub) + '</div>' +
      segBar + body +
      '<div class="card"><h3 class="card-title">About &amp; Data Coverage</h3><p class="card-sub">' + esc(m.about) + '</p>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">' +
      'Valid observations: <strong>' + (cov.validDays || 0) + '/' + (cov.totalDays || 0) + '</strong> (' + (cov.coveragePct || 0) + '%) · Range: ' + esc(fmtDateIN_(cov.firstDate)) + ' → ' + esc(fmtDateIN_(cov.latestDate)) + '</div></div>';

    document.getElementById('btn-detail-back').addEventListener('click', function () { document.getElementById('detail-overlay').classList.remove('open'); });
    box.querySelectorAll('[data-rng]').forEach(function (b) { b.addEventListener('click', function () { STATE.detailRange = b.dataset.rng; renderDetailScreen(); }); });
    box.querySelectorAll('[data-ov]').forEach(function (b) { b.addEventListener('click', function () { STATE.overlays[b.dataset.ov] = !STATE.overlays[b.dataset.ov]; renderDetailScreen(); }); });
    box.querySelectorAll('[data-nsub]').forEach(function (b) { b.addEventListener('click', function () { STATE.nutrSubTab = b.dataset.nsub; renderDetailScreen(); }); });
    box.querySelectorAll('[data-symf]').forEach(function (b) { b.addEventListener('click', function () { STATE.symptomFilter = b.dataset.symf; renderDetailScreen(); }); });
    box.querySelectorAll('[data-symc]').forEach(function (b) { b.addEventListener('click', function () { STATE.symptomCompare = b.dataset.symc; renderDetailScreen(); }); });
    box.querySelectorAll('[data-medf]').forEach(function (b) { b.addEventListener('click', function () { STATE.medFilter = b.dataset.medf; renderDetailScreen(); }); });
    box.querySelectorAll('[data-ltab]').forEach(function (b) { b.addEventListener('click', function () { STATE.labTab = b.dataset.ltab; renderDetailScreen(); }); });
    box.querySelectorAll('[data-lyr]').forEach(function (b) { b.addEventListener('click', function () { STATE.labYearCutoff = b.dataset.lyr; renderDetailScreen(); }); });

    // Wire Goal Path SVG + TDEE Metabolic Adaptation Simulator
    const gs = document.getElementById('gs-range');
    if (gs) {
      const wRows = (d.daily || []).filter(function (r) { return r.weight_kg !== '' && r.weight_kg != null; });
      const cur = wRows.length ? Number(wRows[wRows.length - 1].weight_kg) : 102.7;
      const updGs = function () {
        const tgt = Number(gs.value), rate = 0.76, wks = Math.max(0, (cur - tgt) / rate);
        const dtIso = new Date(Date.now() + wks * 7 * 86400000).toISOString().slice(0, 10);
        document.getElementById('gs-val').textContent = tgt.toFixed(1) + ' kg';
        document.getElementById('gs-svg-box').innerHTML = safeChart_('renderGoalTrajectoryChart', [wRows, tgt, rate], '');
        document.getElementById('gs-out').innerHTML = 'Remaining: <strong>' + (cur - tgt).toFixed(1) + ' kg</strong> · Projected arrival (~0.76 kg/wk): <strong style="color:var(--green);">' + fmtDateIN_(dtIso) + '</strong> (~' + wks.toFixed(1) + ' wks, ±20% band).';
        const estTdeeAtTgt = Math.round(1400 + (tgt - 68) * 14);
        document.getElementById('gs-tdee').innerHTML = '<strong>Metabolic Adaptation Insight:</strong> At ~' + tgt.toFixed(1) + ' kg, estimated maintenance TDEE narrows toward ~<strong>' + estTdeeAtTgt + ' kcal/d</strong>. Maintaining ~1,400 kcal/d + 2×/wk strength training protects BMR and delays plateaus.';
      };
      gs.addEventListener('input', updGs);
      updGs();
    }

    // Wire Multi-Driver Fatty Liver Simulator
    const lvW = document.getElementById('lv-w');
    if (lvW) {
      const updLv = function () {
        const wPct = Number(lvW.value), s = Number(document.getElementById('lv-s').value), f = Number(document.getElementById('lv-f').value),
              sug = Number(document.getElementById('lv-sug').value), st = Number(document.getElementById('lv-st').value), hy = Number(document.getElementById('lv-hy').value);
        document.getElementById('lv-w-val').textContent = wPct + '%';
        document.getElementById('lv-s-val').textContent = s + ' / wk';
        document.getElementById('lv-f-val').textContent = f + ' g/d';
        document.getElementById('lv-sug-val').textContent = sug + ' g/d';
        document.getElementById('lv-st-val').textContent = st + ' / d';
        document.getElementById('lv-hy-val').textContent = hy.toFixed(2) + ' L/d';
        const pts = (wPct >= 7 ? 2 : 1) + (s >= 2 ? 1 : 0) + (f >= 22 ? 1 : 0) + (sug <= 20 ? 1 : 0) + (st >= 6000 ? 1 : 0) + (hy >= 2.2 ? 1 : 0);
        const zone = pts >= 6 ? 'High-Probability Steatosis Resolution (6–10 wks)' : (pts >= 4 ? 'Steady Hepatic Fat Clearance (10–14 wks)' : 'Moderate Pace (14–20 wks)');
        document.getElementById('lv-out').innerHTML = '<strong>Projected Outcome:</strong> <span style="color:var(--green);">' + zone + '</span><br/><strong>Clinical Rationale:</strong> ≥7–10% weight loss mobilizes intrahepatic triglycerides; capping added sugar lowers hepatic de novo lipogenesis; strength + cardio improve insulin sensitivity; soluble fiber &amp; hydration support gut-liver axis clearance.';
      };
      ['lv-w', 'lv-s', 'lv-f', 'lv-sug', 'lv-st', 'lv-hy'].forEach(function (id) { document.getElementById(id).addEventListener('input', updLv); });
      updLv();
    }
  }

  // ==================== TAB 3: REPORTS ====================
  function renderReports() {
    const d = STATE.data, weeks = d.weekly || [], wk = weeks[STATE.selectedWeekIdx] || weeks[weeks.length - 1] || {}, months = d.monthly || [];

    let html = '<div class="card no-print">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
        '<div><h2 class="card-title">Friday Weekly Review (Thu → Wed)</h2><p class="card-sub">Historical backfill since 21-10-2026</p></div>' +
        '<select id="wk-select" class="btn-ghost">' + weeks.map(function (w, i) {
          return '<option value="' + i + '" ' + (i === STATE.selectedWeekIdx ? 'selected' : '') + '>' + esc(w.week_num + ' · ' + fmtDateIN_(w.week_start_thu) + ' → ' + fmtDateIN_(w.week_end_wed)) + '</option>';
        }).join('') + '</select></div>';

    const closeDisp = wk.thu_weight_status === 'Pending' ? '<span style="color:var(--amber);">Pending</span>' : (esc(wk.close_thu_weight_kg) + ' kg');
    const carbFlag = (wk.avg_carbs_g !== '' && Number(wk.avg_carbs_g) > 150) ? ' ⚠' : '';
    const fatFlag = (wk.avg_fat_g !== '' && Number(wk.avg_fat_g) > 65) ? ' ⚠' : '';

    html += '<div class="grid-3" style="margin-top:12px;">' +
      tileHtml_('Open Thu Weight', fmt(wk.open_thu_weight_kg, 'kg'), 'Thu ' + fmtDateIN_(wk.week_start_thu), '#22C55E') +
      tileHtml_('Close Thu Weight', closeDisp, 'Thu ' + fmtDateIN_(wk.closing_thu_date) + ' (' + esc(wk.thu_weight_status || '') + ')', '#B85A9E') +
      tileHtml_('vs. 07-10-2026 Baseline', fmt(wk.delta_vs_oct7_kg, 'kg'), fmt(wk.delta_vs_oct7_pct, '%') + ' · Last: ' + fmt(wk.last_avail_weight_kg, 'kg') + ' (' + fmtDateIN_(wk.last_avail_weight_date) + ')', '#38BDF8') +
      tileHtml_('Nutrition Avg', 'Clean ' + fmt(wk.clean_eating_score, '/100'), 'P ' + fmt(wk.avg_protein_g, 'g') + ' · C ' + fmt(wk.avg_carbs_g, 'g') + carbFlag + ' · F ' + fmt(wk.avg_fat_g, 'g') + fatFlag + ' · Fib ' + fmt(wk.avg_fiber_g, 'g'), '#F59E0B') +
      tileHtml_('Activity & Sleep', fmt(wk.avg_steps, 'steps'), fmtHrsMin_(wk.avg_sleep_hrs) + ' · REM ' + fmt(wk.avg_rem_mins, 'm') + ' · ' + (wk.strength_sessions || 0) + ' strength', '#A855F7') +
      tileHtml_('Dose Response', fmt(wk.dose_mg, 'mg'), 'Hunger ' + fmt(wk.avg_hunger) + ' · Noise ' + fmt(wk.avg_food_noise) + ' · ' + (wk.total_side_effects || 0) + ' symptoms', '#F472B6') +
    '</div><div class="alert-row info" style="margin-top:10px;"><strong>Weekly Habit Review vs. Prior Week:</strong> ' + esc(wk.habit_delta_vs_prev_week || 'Baseline week') + '</div></div>';

    // Upgraded Monthly Clinical & Habit Summaries (Target Attainment Badges + Logged-Day Denominators)
    html += '<div class="card no-print"><h2 class="card-title">Monthly Clinical &amp; Habit Summaries</h2><p class="card-sub" style="margin-bottom:8px;">Includes target attainment (Protein ≥100g, Fiber ≥25g, Steps ≥6,000, Sleep ≥7h) &amp; logged-day coverage</p>' +
      months.map(function (m) {
        const dim = m.days_in_month || 30;
        const pOk = Number(m.avg_protein_g) >= 100, fOk = Number(m.avg_fiber_g) >= 25, sOk = Number(m.avg_steps) >= 6000, slOk = Number(m.avg_sleep_hrs) >= 7;
        return '<div style="padding:10px;border-radius:12px;background:var(--card-2);margin-bottom:8px;font-size:12px;">' +
          '<div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;"><span>' + esc(m.month) + '</span><span>Weight: ' + fmt(m.start_weight_kg) + ' → ' + fmt(m.end_weight_kg, 'kg') + ' (' + fmt(m.delta_kg, 'kg') + ')</span></div>' +
          '<div class="grid-2" style="margin-bottom:6px;gap:6px;">' +
            '<div>Protein: <span class="' + (pOk ? 'badge-ok' : 'badge-miss') + '">' + fmt(m.avg_protein_g, 'g') + ' / 100g ' + (pOk ? '✓' : '·') + '</span> <span style="color:var(--muted);">(' + (m.nutrition_logged_days || '—') + '/' + dim + 'd)</span></div>' +
            '<div>Fiber: <span class="' + (fOk ? 'badge-ok' : 'badge-miss') + '">' + fmt(m.avg_fiber_g, 'g') + ' / 25g ' + (fOk ? '✓' : '·') + '</span></div>' +
            '<div>Steps: <span class="' + (sOk ? 'badge-ok' : 'badge-miss') + '">' + fmt(m.avg_steps) + ' / 6,000 ' + (sOk ? '✓' : '·') + '</span> <span style="color:var(--muted);">(' + (m.steps_logged_days || '—') + '/' + dim + 'd)</span></div>' +
            '<div>Sleep: <span class="' + (slOk ? 'badge-ok' : 'badge-miss') + '">' + fmtHrsMin_(m.avg_sleep_hrs) + ' / 7h ' + (slOk ? '✓' : '·') + '</span> <span style="color:var(--muted);">(' + (m.sleep_logged_days || '—') + '/' + dim + 'd)</span></div>' +
          '</div>' +
          '<div style="font-size:11px;color:var(--muted);">Strength: <strong>' + (m.strength_sessions || 0) + '</strong> sessions · Clean Eating Score: <strong>' + fmt(m.clean_eating_score, '/100') + '</strong> · Goals Met: <strong>' + ((pOk?1:0)+(fOk?1:0)+(sOk?1:0)+(slOk?1:0)) + '/4</strong></div></div>';
      }).join('') + '</div>';

    // Whole-Body Doctor Visit Brief
    html += '<div class="card" id="doctor-brief-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">' +
      '<div><h2 class="card-title">Whole-Body Doctor Visit Brief</h2><p class="card-sub">Diagnoses, meds, procedures, imaging, longitudinal labs &amp; GI tolerability</p></div>' +
      '<div class="no-print" style="display:flex;gap:8px;"><button class="btn-ghost" id="btn-load-brief">Load / Refresh Brief</button><button class="btn-primary" id="btn-print-brief" style="width:auto;padding:8px 14px;">Print / Save PDF</button></div></div>' +
      '<div id="doctor-brief-body" style="margin-top:12px;">' + (STATE.doctorBrief ? renderDoctorBriefHtml_(STATE.doctorBrief) : '<p class="card-sub">Tap <strong>Load / Refresh Brief</strong> to assemble your live whole-body clinical summary.</p>') + '</div></div>';

    const el = document.getElementById('view-reports');
    el.innerHTML = html;
    document.getElementById('wk-select').addEventListener('change', function (e) { STATE.selectedWeekIdx = Number(e.target.value); renderReports(); });
    document.getElementById('btn-print-brief').addEventListener('click', function () { window.print(); });
    document.getElementById('btn-load-brief').addEventListener('click', function () {
      document.getElementById('doctor-brief-body').innerHTML = '<p class="card-sub">Loading clinical records…</p>';
      google.script.run
        .withSuccessHandler(function (brief) { STATE.doctorBrief = brief; renderReports(); })
        .withFailureHandler(function (err) { document.getElementById('doctor-brief-body').innerHTML = '<p style="color:var(--red);">' + esc(err.message || err) + '</p>'; })
        .getDoctorBriefPayload();
    });
  }

  function renderDoctorBriefHtml_(b) {
    return '<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Generated: ' + esc(b.generatedAt) + ' · ' + esc(b.calcVersion) + '</div>' +
      '<h3 class="card-title" style="margin-top:10px;">Active Medications (' + b.activeMedications.length + ')</h3>' +
      '<table class="clean-tbl"><thead><tr><th>Medication</th><th>Strength / Dosage</th><th>Frequency</th></tr></thead><tbody>' +
      b.activeMedications.map(function (m) { return '<tr><td><strong>' + esc(m.brand || m.generic) + '</strong></td><td>' + esc(m.strength + ' ' + m.dosage) + '</td><td>' + esc(m.frequency) + '</td></tr>'; }).join('') +
      '</tbody></table><h3 class="card-title" style="margin-top:12px;">Latest Key Laboratory Markers</h3>' +
      '<table class="clean-tbl"><thead><tr><th>Test</th><th>Value</th><th>Date</th><th>Ref Range</th><th>Flag</th></tr></thead><tbody>' +
      b.latestLabs.map(function (l) { return '<tr><td>' + esc(l.testName) + '</td><td><strong>' + esc(l.value + ' ' + l.unit) + '</strong></td><td>' + esc(fmtDateIN_(l.testDate)) + '</td><td>' + esc(l.refRange) + '</td><td>' + esc(l.abnormalFlag) + '</td></tr>'; }).join('') +
      '</tbody></table><h3 class="card-title" style="margin-top:12px;">Recent Procedures &amp; Imaging</h3><ul style="margin:4px 0;padding-left:18px;font-size:12px;">' +
      b.procedures.map(function (p) { return '<li><strong>' + esc(fmtDateIN_(p.date)) + ':</strong> ' + esc(p.name) + ' (' + esc(p.status) + ')</li>'; }).join('') +
      b.imagingHighlights.slice(0, 3).map(function (im) { return '<li><strong>' + esc(fmtDateIN_(im.date) + ' ' + im.modality) + ':</strong> ' + esc(im.impression) + '</li>'; }).join('') + '</ul>';
  }

  // ==================== TAB 4: WISDOM ====================
  function renderWisdom() {
    const aiRows = (STATE.data.aiOutputs || []).slice().reverse();
    const starters = [
      'Compare my Day 0–2 belching & reflux pattern against tirzepatide clinical trials — expected or worth flagging?',
      'Given my Sept 2026 HbA1c 6.2%, insulin 34, and Grade 1 fatty liver, what nutrition tweaks matter most this month?',
      'When is the ideal timing for my post-IV-iron ferritin and post-Thyronorm TSH follow-up labs?'
    ];
    let html = '<div class="card card-plum"><div style="display:flex;justify-content:space-between;align-items:center;"><div><h2 class="card-title">Personal Health Wisdom</h2><p class="card-sub">Powered by your Google AI Pro Gemini Tasks &amp; Gem ($0 extra)</p></div>' + provBadge('AI') + '</div>' +
      '<div style="margin-top:10px;display:flex;flex-direction:column;gap:7px;">' + starters.map(function (q) {
        return '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12px;">✦ ' + esc(q) + '</div>';
      }).join('') + '</div></div>' +
      '<div class="card"><h2 class="card-title">Saved AI Briefs &amp; Symptom Peer-Expectedness</h2>' +
      (aiRows.length ? aiRows.map(function (r) {
        return '<div style="padding:10px 0;border-bottom:1px solid var(--border);"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);"><span>' + esc(r.report_type) + ' · ' + esc(fmtDateIN_(r.period_key)) + '</span><span>' + esc(r.generated_at) + '</span></div>' +
          '<div style="font-weight:700;margin:3px 0;">' + esc(r.headline) + '</div><div style="font-size:12.5px;color:var(--muted);">' + esc(r.body_markdown) + '</div><div style="font-size:11px;color:var(--plum);margin-top:4px;">' + esc(r.citations || '') + '</div></div>';
      }).join('') : '<p class="card-sub">Phase 3 Gemini Scheduled Actions will populate briefs here.</p>') + '</div>' +
      '<div class="card" style="border-style:dashed;opacity:0.78;"><div style="display:flex;justify-content:space-between;align-items:center;"><h2 class="card-title">GLP-1 News &amp; Research Pulse</h2><span class="prov">Planned · V2</span></div><p class="card-sub" style="margin-top:4px;">Weekly curated feed of new GLP-1 trials, regulatory updates, and metabolic research trends.</p></div>';
    document.getElementById('view-wisdom').innerHTML = html;
  }

  // ==================== HELPERS ====================
  function tileHtml_(k, v, d, accent) {
    return '<div class="stat-tile"><div class="stat-k"><span>' + esc(k) + '</span><span style="color:' + accent + ';">●</span></div><div class="stat-v">' + v + '</div><div class="stat-d">' + esc(d) + '</div></div>';
  }
  function tileFormulaHtml_(k, v, d, accent, fId, fText) {
    return '<div class="stat-tile"><div class="stat-k"><span>' + esc(k) + '</span><span><button class="info-btn" data-fbox="' + fId + '" title="Formula">ⓘ</button> <span style="color:' + accent + ';">●</span></span></div>' +
      '<div class="stat-v">' + v + '</div><div class="stat-d">' + esc(d) + '</div><div class="formula-box" id="' + fId + '">' + esc(fText) + '</div></div>';
  }
  function getLatestWeight_(daily) {
    for (let i = daily.length - 1; i >= 0; i--) {
      if (daily[i].weight_kg !== '' && daily[i].weight_kg != null) return { w: Number(daily[i].weight_kg), date: daily[i].date };
    }
    return null;
  }
  function buildDailyNudges_(cur7) {
    const out = [];
    if (cur7.avgProtein !== '' && cur7.avgProtein < 95) out.push({ tag: 'Muscle Shield', title: 'Add 1 Protein Anchor (+25g)', action: 'Aim for a whey shake, Greek yogurt, or paneer/egg anchor today.', dataWhy: '7-day avg protein is ' + cur7.avgProtein + ' g/d (target ~100 g/d).', evidence: 'Adequate protein supports lean-mass preservation on GLP-1 therapy.' });
    if (cur7.avgFiber !== '' && cur7.avgFiber < 22) out.push({ tag: 'GI & Glycemic', title: 'Boost Fiber + Fluids', action: 'Add psyllium/chia/dal (+8–10g fiber) alongside 2+ L water.', dataWhy: '7-day avg fiber is ' + cur7.avgFiber + ' g/d.', evidence: 'Soluble fiber supports regularity and blunts post-meal glucose spikes.' });
    if ((cur7.strengthSessions || 0) < 2) out.push({ tag: 'Post-GLP-1 Habit', title: 'Schedule 25-Min Strength', action: 'Shift 1–2 walks this week into light resistance training.', dataWhy: 'Only ' + (cur7.strengthSessions || 0) + ' strength session(s) in the last 7 days.', evidence: 'Resistance training is the primary driver of lean-mass retention.' });
    if ((cur7.nutritionLoggedDays || 0) < 5) out.push({ tag: 'Logging Nudge', title: 'Quick Nutrition Catch-Up', action: 'Log today\'s main meals so protein & bioavailability trends stay sharp.', dataWhy: 'Nutrition logged on ' + (cur7.nutritionLoggedDays || 0) + '/7 recent days.', evidence: 'Consistent logging improves self-monitoring awareness.' });
    if (!out.length) out.push({ tag: 'Momentum', title: 'Strong 7-Day Rhythm!', action: 'Keep protecting your 7h+ sleep and daily movement streak.', dataWhy: 'Steps, protein, and sleep are tracking solidly this week.', evidence: 'Consistent daily habits build durable post-GLP-1 maintenance.' });
    return out;
  }

  // Boot strictly into Lock Screen — zero data fetched until PIN verified!
  pinField.focus();
})();
</script>
